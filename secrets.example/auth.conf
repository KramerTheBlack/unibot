# Authentication Module Secrets
# Default administrator credentials
# Version: 2026.10.21_1

[admin]
username = unibotadmin
password = tellmepass

# Default user groups
[groups]
default_group = anonymous
admin_group = administrators
customer_group = customers

# Session settings
[session]
secret_key = unibot_secret_session_key_2026
session_timeout = 3600

# Database settings for user storage
[database]
type = sqlite
path = /var/unibot/secrets/auth.db
