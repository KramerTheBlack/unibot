# Multi-chat Module Configuration
# Version: 2026.10.21_1

[general]
# Server settings
listen_address = 0.0.0.0
listen_port = 5003

# Supported platforms
supported_platforms = vk,telegram,max

# Webhook settings
webhook_enabled = true
webhook_path = /webhook

# Message processing
max_message_length = 4096
message_timeout = 30
rate_limit = 10  # messages per second per user

# State management
state_ttl = 3600  # conversation state timeout in seconds

# Logging
log_level = INFO
log_file = /var/log/unibot/multichat.log
log_max_size = 10485760
log_backup_count = 5

# Platform-specific settings
[vk]
enabled = true
webhook_path = /webhook/vk
api_version = 5.131

[telegram]
enabled = true
webhook_path = /webhook/telegram
api_url = https://api.telegram.org

[max]
enabled = true
webhook_path = /webhook/max
api_url = https://api.max.com
