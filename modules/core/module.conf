# Core Module Configuration
# Version: 2026.10.21_1

[general]
# Message queue settings
message_queue_enabled = true
max_queue_size = 1000
queue_timeout = 30
retry_attempts = 3

# Thread pool settings
thread_pool_size = 10
max_threads = 20
min_threads = 5

# Cache settings
cache_enabled = true
cache_ttl = 3600
cache_max_size = 1000

# Logging settings
log_level = INFO
log_file = /var/log/unibot/core.log
log_max_size = 10485760
log_backup_count = 5

# Network settings
listen_address = 0.0.0.0
listen_port = 5000

# Security
enable_ssl = false
# ssl_cert = /etc/ssl/certs/core.crt
# ssl_key = /etc/ssl/private/core.key

# Module registration
auto_register_modules = true
module_check_interval = 60

# Performance
max_request_size = 10485760
connection_timeout = 30
read_timeout = 60
