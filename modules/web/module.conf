# Web Module Configuration
# Version: 2026.10.21_1

[general]
# Server settings
listen_address = 0.0.0.0
listen_port = 8080

# SSL/TLS settings
use_https = false
ssl_cert = /etc/ssl/certs/web.crt
ssl_key = /etc/ssl/private/web.key

# Web interface settings
title = UniBot Administration Console
owner_name = UniBot Team
owner_email = admin@unibot.local
owner_website = https://unibot.example.com

# Admin console path
admin_path = /admin

# Theme and styling
theme = default
theme_path = /var/www/unibot/themes
primary_color = #3498db
secondary_color = #2980b9
background_color = #f5f5f5
text_color = #333333

# Icons and images
favicon = /static/favicon.ico
logo = /static/logo.png

# Authentication
session_timeout = 3600
remember_me_duration = 2592000

# Rate limiting
max_requests_per_minute = 100
burst_limit = 20

# Security headers
enable_csp = true
csp_policy = default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:
enable_xss_protection = true
enable_frame_options = true
frame_options = DENY

# Logging
log_level = INFO
log_file = /var/log/unibot/web.log
log_max_size = 10485760
log_backup_count = 5

# Static files
static_dir = /var/www/unibot/static
uploads_dir = /var/www/unibot/uploads
max_upload_size = 10485760

# API settings
api_prefix = /api/v1
cors_origins = *

# Module endpoints (for proxy)
core_endpoint = http://core:5000
auth_endpoint = http://auth:5001
