# Datastore Module Configuration
# Version: 2026.10.21_1

[general]
# Server settings
listen_address = 0.0.0.0
listen_port = 5002

# Default database connection (if any)
default_connection = sqlite

# Logging
log_level = INFO
log_file = /var/log/unibot/datastore.log
log_max_size = 10485760
log_backup_count = 5

# Connection timeout
connection_timeout = 30
query_timeout = 60
max_retries = 3
retry_delay = 1

# Pool settings
pool_enabled = true
min_pool_size = 5
max_pool_size = 20
pool_timeout = 30

# Cache settings (for query results)
cache_enabled = true
cache_ttl = 300
cache_max_size = 1000
