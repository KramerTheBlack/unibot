# LLM Module Configuration
# Version: 2026.10.21_1

[general]
# Server settings
listen_address = 0.0.0.0
listen_port = 5004

# Default settings
default_provider = openai
default_model = gpt-4
max_tokens = 4096
temperature = 0.7
top_p = 1.0
frequency_penalty = 0.0
presence_penalty = 0.0

# Security
sanitize_input = true
sanitize_output = true
content_filter_enabled = true

# Privacy
store_conversations = false
anonymize_user_data = true
log_prompts = false

# Rate limiting
max_requests_per_minute = 60
max_tokens_per_minute = 60000
burst_limit = 10

# Timeout
timeout = 30
retry_attempts = 3

# Logging
log_level = INFO
log_file = /var/log/unibot/llm.log
log_max_size = 10485760
log_backup_count = 5

# Provider-specific settings
[openai]
enabled = true
api_url = https://api.openai.com/v1
api_key = ""
organization_id = ""
models = gpt-4,gpt-4-32k,gpt-4-turbo,gpt-3.5-turbo

[yandex]
enabled = true
api_url = https://api.cloud.yandex.net
api_key = ""
folder_id = ""
models = yandexgpt,yandexgpt-lite

[google]
enabled = true
api_url = https://generativelanguage.googleapis.com
api_key = ""
models = gemini-pro,gemini-1.5-pro

[local]
enabled = false
api_url = http://localhost:11434
models = llama2,mistral,phi2
