# Apps Module Configuration
# Version: 2026.10.21_1

[general]
# Apps directory
apps_dir = /app

# Loading settings
load_all_on_startup = true
auto_discover = true
max_apps = 100

# Performance
app_timeout = 30
max_concurrent_calls = 10

# Logging settings
log_level = INFO
log_file = /var/log/unibot/apps.log
log_max_size = 10485760
log_backup_count = 5

# Network settings
listen_address = 0.0.0.0
listen_port = 5006

# Security
enable_ssl = false
# ssl_cert = /etc/ssl/certs/apps.crt
# ssl_key = /etc/ssl/private/apps.key
