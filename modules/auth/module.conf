# Auth Module Configuration
# Version: 2026.10.21_1

[general]
# Default administrator credentials (for initial setup)
default_admin_username = unibotadmin
default_admin_password = tellmepass

# Session settings
session_timeout = 3600
session_encryption_key = default_change_me_key_12345

# Registration settings
registration_enabled = true
registration_requires_approval = false

# Storage settings (file, sqlite, or datastore)
storage_type = file
storage_path = /var/lib/unibot/auth

# SQLite database settings (if storage_type = sqlite)
sqlite_path = /var/lib/unibot/auth/users.db

# Password policies
min_password_length = 8
require_uppercase = false
require_lowercase = false
require_digits = true
require_special_chars = false

# Authentication attempts
max_login_attempts = 5
lockout_duration = 300

# Security
password_hash_algorithm = sha256
encryption_algorithm = aes-256-cbc

# Menu integration
enable_registration_menu = true
enable_admin_menu = true

# API settings
listen_address = 0.0.0.0
listen_port = 5001

# Logging
log_level = INFO
log_file = /var/log/unibot/auth.log
